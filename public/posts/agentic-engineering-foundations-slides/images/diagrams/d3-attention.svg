<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1920" viewBox="0 0 1920 1920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#cfccca"/></marker>
    <marker id="arrTeal" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#03c6b2"/></marker>
  </defs>
  <rect width="1920" height="1920" fill="#131313"/>

  <!-- Header -->
  <text x="64" y="58" font-size="20" letter-spacing="3" fill="#FFC107" font-weight="bold">UNDER THE HOOD</text>
  <text x="64" y="104" font-size="44" fill="#e5e2e1" font-weight="bold">Inside the Forward Pass: Attention</text>
  <text x="64" y="140" font-size="22" fill="#9b9795">How one token uses the KV store to decide what it means — the "soft dictionary lookup", worked out.</text>

  <!-- Sentence banner -->
  <rect x="64" y="172" width="1792" height="64" rx="10" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="960" y="213" font-size="26" fill="#cfccca" text-anchor="middle">"The cat sat on the mat because <tspan fill="#FFC107" font-weight="bold">it</tspan> was tired."  —  processing <tspan fill="#FFC107" font-weight="bold">"it"</tspan>: which earlier token do I refer to?</text>

  <!-- Query box -->
  <rect x="64" y="470" width="250" height="200" rx="14" fill="#241b1a" stroke="#ffb4ab" stroke-width="2.5"/>
  <text x="189" y="512" font-size="24" fill="#ffb4ab" font-weight="bold" text-anchor="middle">Query (Q)</text>
  <text x="189" y="544" font-size="20" fill="#e5e2e1" text-anchor="middle">of "it"</text>
  <text x="189" y="584" font-size="17" fill="#cfccca" text-anchor="middle">what am I</text>
  <text x="189" y="606" font-size="17" fill="#cfccca" text-anchor="middle">looking for?</text>
  <text x="189" y="648" font-size="15" fill="#9b9795" text-anchor="middle">used once, then dropped</text>

  <!-- arrow Query -> KV store -->
  <line x1="314" y1="560" x2="392" y2="560" stroke="#cfccca" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="316" y="548" font-size="15" fill="#9b9795">compare</text>

  <!-- KV store container -->
  <rect x="400" y="300" width="640" height="600" rx="14" fill="#102320" stroke="#03c6b2" stroke-width="2.5"/>
  <text x="424" y="344" font-size="24" fill="#03c6b2" font-weight="bold">② KV Cache Store — every earlier token</text>
  <!-- column headers -->
  <text x="430" y="392" font-size="16" fill="#9b9795">token</text>
  <text x="600" y="392" font-size="16" fill="#FFC107">Key (K)</text>
  <text x="730" y="392" font-size="16" fill="#03c6b2">Value (V)</text>
  <text x="900" y="392" font-size="16" fill="#9b9795">① Q&#183;K score</text>

  <!-- rows -->
  <!-- cat -->
  <text x="430" y="450" font-size="22" fill="#e5e2e1" font-weight="bold">cat</text>
  <rect x="590" y="428" width="70" height="32" rx="6" fill="#2a2410" stroke="#FFC107" stroke-width="1.5"/><text x="625" y="450" font-size="15" fill="#FFC107" text-anchor="middle">K</text>
  <rect x="725" y="428" width="70" height="32" rx="6" fill="#0c1a18" stroke="#03c6b2" stroke-width="1.5"/><text x="760" y="450" font-size="15" fill="#03c6b2" text-anchor="middle">V</text>
  <text x="915" y="450" font-size="22" fill="#e5e2e1" font-weight="bold">9.1</text>
  <!-- mat -->
  <text x="430" y="528" font-size="22" fill="#e5e2e1" font-weight="bold">mat</text>
  <rect x="590" y="506" width="70" height="32" rx="6" fill="#2a2410" stroke="#FFC107" stroke-width="1.5"/><text x="625" y="528" font-size="15" fill="#FFC107" text-anchor="middle">K</text>
  <rect x="725" y="506" width="70" height="32" rx="6" fill="#0c1a18" stroke="#03c6b2" stroke-width="1.5"/><text x="760" y="528" font-size="15" fill="#03c6b2" text-anchor="middle">V</text>
  <text x="915" y="528" font-size="22" fill="#e5e2e1" font-weight="bold">4.0</text>
  <!-- sat -->
  <text x="430" y="606" font-size="22" fill="#cfccca">sat</text>
  <rect x="590" y="584" width="70" height="32" rx="6" fill="#2a2410" stroke="#FFC107" stroke-width="1.5"/><text x="625" y="606" font-size="15" fill="#FFC107" text-anchor="middle">K</text>
  <rect x="725" y="584" width="70" height="32" rx="6" fill="#0c1a18" stroke="#03c6b2" stroke-width="1.5"/><text x="760" y="606" font-size="15" fill="#03c6b2" text-anchor="middle">V</text>
  <text x="915" y="606" font-size="22" fill="#cfccca">0.3</text>
  <!-- the -->
  <text x="430" y="684" font-size="22" fill="#cfccca">the</text>
  <rect x="590" y="662" width="70" height="32" rx="6" fill="#2a2410" stroke="#FFC107" stroke-width="1.5"/><text x="625" y="684" font-size="15" fill="#FFC107" text-anchor="middle">K</text>
  <rect x="725" y="662" width="70" height="32" rx="6" fill="#0c1a18" stroke="#03c6b2" stroke-width="1.5"/><text x="760" y="684" font-size="15" fill="#03c6b2" text-anchor="middle">V</text>
  <text x="915" y="684" font-size="22" fill="#cfccca">0.1</text>
  <!-- ellipsis -->
  <text x="430" y="754" font-size="22" fill="#6f6b69">… every other earlier token</text>
  <text x="700" y="820" font-size="16" fill="#9b9795">Q is compared against ALL rows — not just one</text>

  <!-- step 1 arrows Q -> each row (fan) -->
  <line x1="392" y1="540" x2="900" y2="440" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="392" y1="555" x2="900" y2="518" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="392" y1="570" x2="900" y2="596" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="392" y1="585" x2="900" y2="674" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- arrow KV -> softmax -->
  <line x1="1040" y1="540" x2="1118" y2="540" stroke="#cfccca" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Softmax block -->
  <rect x="1126" y="380" width="340" height="440" rx="14" fill="#1c1c1c" stroke="#6f6b69" stroke-width="2"/>
  <text x="1150" y="424" font-size="22" fill="#e5e2e1" font-weight="bold">② Softmax</text>
  <text x="1150" y="452" font-size="16" fill="#9b9795">scores &#8594; weights (sum = 100%)</text>
  <!-- weight bars -->
  <text x="1150" y="500" font-size="20" fill="#e5e2e1">cat</text>
  <rect x="1200" y="484" width="170" height="22" rx="4" fill="#FFC107"/><text x="1382" y="502" font-size="18" fill="#FFC107">85%</text>
  <text x="1150" y="556" font-size="20" fill="#e5e2e1">mat</text>
  <rect x="1200" y="540" width="40" height="22" rx="4" fill="#9b8536"/><text x="1382" y="558" font-size="18" fill="#cfccca">10%</text>
  <text x="1150" y="612" font-size="20" fill="#cfccca">sat</text>
  <rect x="1200" y="596" width="14" height="22" rx="4" fill="#6f6b69"/><text x="1382" y="614" font-size="18" fill="#9b9795">3%</text>
  <text x="1150" y="668" font-size="20" fill="#cfccca">the</text>
  <rect x="1200" y="652" width="10" height="22" rx="4" fill="#6f6b69"/><text x="1382" y="670" font-size="18" fill="#9b9795">2%</text>
  <text x="1150" y="730" font-size="16" fill="#6f6b69">…rest &#8594; ~0%</text>
  <text x="1150" y="784" font-size="16" fill="#9b9795">these are the attention weights</text>

  <!-- arrow softmax -> blend -->
  <line x1="1466" y1="540" x2="1544" y2="540" stroke="#03c6b2" stroke-width="2.5" marker-end="url(#arrTeal)"/>

  <!-- Weighted blend / output -->
  <rect x="1552" y="380" width="304" height="440" rx="14" fill="#102320" stroke="#03c6b2" stroke-width="2.5"/>
  <text x="1576" y="424" font-size="22" fill="#03c6b2" font-weight="bold">③ Weighted blend</text>
  <text x="1576" y="452" font-size="16" fill="#9b9795">of the Values</text>
  <text x="1576" y="506" font-size="19" fill="#e5e2e1">0.85 &#183; V(cat)</text>
  <text x="1576" y="538" font-size="19" fill="#cfccca">+ 0.10 &#183; V(mat)</text>
  <text x="1576" y="570" font-size="19" fill="#cfccca">+ 0.03 &#183; V(sat)</text>
  <text x="1576" y="602" font-size="19" fill="#9b9795">+ …</text>
  <line x1="1576" y1="628" x2="1832" y2="628" stroke="#03c6b2" stroke-width="1.5"/>
  <text x="1576" y="672" font-size="20" fill="#e5e2e1" font-weight="bold">one output vector</text>
  <text x="1576" y="704" font-size="19" fill="#03c6b2">&#8776; mostly cat's Value</text>
  <rect x="1576" y="730" width="256" height="56" rx="8" fill="#0c1a18" stroke="#03c6b2" stroke-width="1.5"/>
  <text x="1704" y="765" font-size="20" fill="#FFC107" font-weight="bold" text-anchor="middle">"it" &#8594; cat</text>

  <!-- Bottom takeaway -->
  <rect x="64" y="940" width="1792" height="100" rx="10" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="88" y="982" font-size="21" fill="#cfccca">Attention never returns one entry — it returns a <tspan fill="#03c6b2" font-weight="bold">blend</tspan> of all Values, weighted by relevance. That is the "soft" in soft lookup.</text>
  <text x="88" y="1016" font-size="21" fill="#cfccca">To do it, every step reads <tspan font-weight="bold">every</tspan> row of the KV store — which is why the whole history must stay resident, and why longer context costs more on every token.</text>
</svg>
