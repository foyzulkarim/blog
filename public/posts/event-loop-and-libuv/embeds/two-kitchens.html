<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Kitchens — Animated</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: #F5F6F8;
    font-family: Helvetica, Arial, sans-serif;
    color: #1E2430;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { max-width: 920px; width: 100%; }
  svg { width: 100%; height: auto; display: block; }

  /* Kitchen One tokens (network I/O) */
  .k1-token {
    fill: #FFFFFF;
    stroke: #1F7A6C;
    stroke-width: 2;
    transition: fill 200ms ease, opacity 200ms ease;
  }
  .k1-token.lit { fill: #1F7A6C; }
  .k1-token.fading { opacity: 0; }

  /* Kitchen Two queue tokens (waiting for a chef) */
  .k2-token {
    fill: #FFFFFF;
    stroke: #B8712B;
    stroke-width: 2;
    transition: opacity 200ms ease;
  }
  .k2-token.fading { opacity: 0; }

  /* chefs */
  .chef {
    fill: #FFFFFF;
    stroke: #B8712B;
    stroke-width: 2;
    transition: fill 200ms ease;
  }
  .chef.busy { fill: #B8712B; }

  .captions {
    margin-top: 18px;
    text-align: center;
    min-height: 56px;
  }
  #captionMain {
    font-size: 17px;
    font-weight: 700;
    color: #1E2430;
  }
  #captionSub {
    font-size: 13px;
    color: #5B6B7A;
    margin-top: 4px;
  }

  .controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid #34506B;
    background: #FFFFFF;
    color: #1E2430;
    cursor: pointer;
  }
  button:hover { background: #EEF1F4; }
  button.speed-active {
    background: #34506B;
    color: #FFFFFF;
  }
  .legend {
    margin-top: 18px;
    font-size: 12px;
    color: #8A93A3;
    text-align: center;
  }
</style>
</head>
<body>

<div class="wrap">
  <svg id="scene" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="900" height="650" fill="#F5F6F8"/>

    <text x="450" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E2430">Where the Work Goes — Two Kitchens, Live</text>
    <text x="450" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B7A">Scripted traffic, including one burst — watch what each kitchen does with it</text>

    <!-- LEFT PANEL: Kitchen One -->
    <rect x="40" y="88" width="390" height="402" rx="14" fill="#F0FAF8" stroke="#1F7A6C" stroke-width="2.5"/>
    <text x="235" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F4D42">Kitchen One</text>
    <text x="235" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F5A50">the order board (OS sockets, epoll)</text>
    <text x="235" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2430">network calls — HTTP, Postgres,</text>
    <text x="235" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2430">fetch, Redis</text>

    <rect x="70" y="215" width="330" height="185" rx="10" fill="#FBFEFD" stroke="#8FBDB5" stroke-width="1.5" stroke-dasharray="5,4"/>

    <text x="235" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" id="k1Counter" fill="#0F4D42">active: 0</text>
    <text x="235" y="445" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1F5A50">No threads — waiting costs nothing, at any scale.</text>

    <!-- RIGHT PANEL: Kitchen Two -->
    <rect x="470" y="88" width="390" height="402" rx="14" fill="#FBF3E8" stroke="#B8712B" stroke-width="2.5"/>
    <text x="665" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#7A4B15">Kitchen Two</text>
    <text x="665" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8A5A1E">four chefs (libuv thread pool)</text>
    <text x="665" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2430">fs.*, dns.lookup, crypto,</text>
    <text x="665" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2430">zlib (gzip, deflate...)</text>

    <rect x="500" y="215" width="330" height="185" rx="10" fill="#FFFCF7" stroke="#D9A968" stroke-width="1.5" stroke-dasharray="5,4"/>

    <!-- 4 chefs, fixed positions -->
    <g>
      <rect x="529" y="223" width="24" height="10" rx="4" fill="#B8712B"/>
      <circle class="chef" data-chef="0" cx="541" cy="255" r="20"/>
      <rect x="612" y="223" width="24" height="10" rx="4" fill="#B8712B"/>
      <circle class="chef" data-chef="1" cx="624" cy="255" r="20"/>
      <rect x="694" y="223" width="24" height="10" rx="4" fill="#B8712B"/>
      <circle class="chef" data-chef="2" cx="706" cy="255" r="20"/>
      <rect x="777" y="223" width="24" height="10" rx="4" fill="#B8712B"/>
      <circle class="chef" data-chef="3" cx="789" cy="255" r="20"/>
    </g>

    <g id="k1Layer"></g>
    <g id="k2Layer"></g>

    <text x="665" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" id="k2Counter" fill="#7A4B15">chefs busy: 0/4 · queue: 0</text>
    <text x="665" y="445" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8A5A1E">Pool size 4 by default — shared by everything above.</text>

    <!-- bottom strip -->
    <rect x="40" y="510" width="820" height="110" rx="12" fill="#FFFFFF" stroke="#97A1B0" stroke-width="1.5"/>
    <text x="450" y="535" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E2430">Thread pool exhaustion, happening live</text>
    <text x="450" y="558" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3A4552">Kitchen one absorbs the burst — more lights on the board, same speed.</text>
    <text x="450" y="580" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3A4552">Kitchen two's four chefs saturate — the queue above is real backlog, not a bug.</text>
    <text x="450" y="602" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5B6B7A">UV_THREADPOOL_SIZE sets the chef count (default 4, max 128) — set before the process starts.</text>
  </svg>

  <div class="captions">
    <div id="captionMain">Normal traffic — steady trickle of requests</div>
    <div id="captionSub">both kitchens keep up easily</div>
  </div>

  <div class="controls">
    <button id="playPauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>
    <button id="stepBtn">Step ▶</button>
    <button class="speed-btn" data-speed="0.5">0.5×</button>
    <button class="speed-btn speed-active" data-speed="1">1×</button>
    <button class="speed-btn" data-speed="2">2×</button>
  </div>

  <div class="legend">outline = pending / queued &nbsp;·&nbsp; filled = light on (ready) or chef cooking &nbsp;·&nbsp; Step ▶ jumps to the next event</div>
</div>

<script>
(function () {
  const SVGNS = 'http://www.w3.org/2000/svg';
  function svgEl(tag) { return document.createElementNS(SVGNS, tag); }

  // ---- 1. The scripted request timeline ---------------------------------
  // Every request is defined once, up front, as { id, kitchen, label, arrival, duration }.
  // Nothing here is random — this is a fixed scenario, easy to retime later.

  const K1_SLOTS = [                      // 8 visual slots on Kitchen One's board
    [111, 260], [194, 260], [276, 260], [359, 260],
    [111, 345], [194, 345], [276, 345], [359, 345]
  ];
  const LIT_DURATION = 300;   // ms the light stays on before fading (K1)
  const FADE_DURATION = 200;  // ms fade-out after finishing (both kitchens)

  const k1Raw = [
    { id: 'k1-1', label: 'HTTP request',   arrival: 300,  duration: 900 },
    { id: 'k1-2', label: 'Postgres query', arrival: 1200, duration: 1400 },
    { id: 'k1-3', label: 'fetch call',     arrival: 2400, duration: 700 },
    { id: 'k1-4', label: 'HTTP request',   arrival: 3300, duration: 1000 },
    { id: 'k1-5', label: 'fetch call',     arrival: 4050, duration: 600 },
    { id: 'k1-6', label: 'Postgres query', arrival: 4400, duration: 800 },
    { id: 'k1-7', label: 'fetch call',     arrival: 4800, duration: 500 },
    { id: 'k1-8', label: 'HTTP request',   arrival: 6200, duration: 700 },
    { id: 'k1-9', label: 'HTTP request',   arrival: 7500, duration: 800 }
  ];

  const k2Raw = [
    { id: 'k2-1',  label: 'fs.readFile', arrival: 600,  duration: 500 },
    { id: 'k2-2',  label: 'dns.lookup',  arrival: 2000, duration: 400 },
    // burst: a fan-out call fires 10 outbound dns.lookup calls in rapid succession
    { id: 'k2-3',  label: 'dns.lookup',  arrival: 4000, duration: 700 },
    { id: 'k2-4',  label: 'dns.lookup',  arrival: 4080, duration: 700 },
    { id: 'k2-5',  label: 'dns.lookup',  arrival: 4160, duration: 700 },
    { id: 'k2-6',  label: 'dns.lookup',  arrival: 4240, duration: 700 },
    { id: 'k2-7',  label: 'dns.lookup',  arrival: 4320, duration: 700 },
    { id: 'k2-8',  label: 'dns.lookup',  arrival: 4400, duration: 700 },
    { id: 'k2-9',  label: 'dns.lookup',  arrival: 4480, duration: 700 },
    { id: 'k2-10', label: 'dns.lookup',  arrival: 4560, duration: 700 },
    { id: 'k2-11', label: 'dns.lookup',  arrival: 4640, duration: 700 },
    { id: 'k2-12', label: 'dns.lookup',  arrival: 4720, duration: 700 },
    { id: 'k2-13', label: 'fs.readFile', arrival: 7800, duration: 400 }
  ];

  const captionEvents = [
    { time: 0,    main: 'Normal traffic — steady trickle of requests',
                  sub: 'both kitchens keep up easily' },
    { time: 4000, main: 'Burst: a fan-out call fires 10 outbound DNS lookups at once',
                  sub: "watch kitchen two's queue build while kitchen one stays flat" },
    { time: 6300, main: 'Burst absorbed — kitchen two finishes draining the queue',
                  sub: 'nothing was dropped, it just waited its turn' },
    { time: 8600, main: 'Back to idle',
                  sub: 'press Restart to watch it again' }
  ];

  const TOTAL_DURATION = 9500;  // ms of scripted activity
  const IDLE_PAUSE = 2000;      // ms to sit idle before auto-restarting
  const CYCLE = TOTAL_DURATION + IDLE_PAUSE;

  // ---- 2. Pre-compute the full schedule (queueing simulation) -----------
  // Kitchen One: no queueing. Just assign each token a free visual slot.
  function scheduleK1(events) {
    const sorted = events.slice().sort((a, b) => a.arrival - b.arrival);
    const slotFreeAt = K1_SLOTS.map(() => 0);
    return sorted.map(ev => {
      let slot = 0;
      for (let i = 0; i < slotFreeAt.length; i++) {
        if (slotFreeAt[i] <= ev.arrival) { slot = i; break; }
        if (slotFreeAt[i] < slotFreeAt[slot]) slot = i; // fallback: least-busy
      }
      const serviceEnd = ev.arrival + ev.duration;
      slotFreeAt[slot] = serviceEnd + LIT_DURATION;
      return Object.assign({}, ev, { slot, serviceEnd });
    });
  }

  // Kitchen Two: real FIFO queueing across 4 chefs — this is where the
  // backlog comes from. A chef is "free" the moment its current job ends;
  // an arriving request grabs the chef that frees up earliest.
  function scheduleK2(events) {
    const sorted = events.slice().sort((a, b) => a.arrival - b.arrival);
    const chefFreeAt = [0, 0, 0, 0];
    return sorted.map(ev => {
      let chef = 0;
      for (let i = 1; i < chefFreeAt.length; i++) {
        if (chefFreeAt[i] < chefFreeAt[chef]) chef = i;
      }
      const serviceStart = Math.max(ev.arrival, chefFreeAt[chef]);
      const serviceEnd = serviceStart + ev.duration;
      chefFreeAt[chef] = serviceEnd;
      return Object.assign({}, ev, { chef, serviceStart, serviceEnd });
    });
  }

  const k1Schedule = scheduleK1(k1Raw);
  const k2Schedule = scheduleK2(k2Raw);

  // ---- Step support -------------------------------------------------------
  // A "step" is the next moment at which something changes: a request
  // arrives, a queued request gets a chef, a request finishes.
  // Moments closer than STEP_CLUSTER_MS are treated as one step, so the
  // ten-call burst reads as one event rather than ten clicks.
  const STEP_CLUSTER_MS = 100;
  function clusterSteps(events) {
    const sorted = events.slice().sort((a, b) => a.time - b.time);
    const clusters = [];
    sorted.forEach(ev => {
      const last = clusters[clusters.length - 1];
      if (last && ev.time - last.end <= STEP_CLUSTER_MS) { last.end = ev.time; last.events.push(ev); }
      else clusters.push({ start: ev.time, end: ev.time, events: [ev] });
    });
    return clusters;
  }
  const STEP_VERBS = {
    arrive: ['arrives at kitchen', 'arrive at kitchen'],
    start:  ['starts cooking at kitchen', 'start cooking at kitchen'],
    done:   ['finishes at kitchen', 'finish at kitchen'],
    pickup: ['is collected at poll', 'are collected at poll']
  };
  function describeStep(cluster) {
    const groups = {};
    cluster.events.forEach(ev => {
      if (ev.kind === 'caption') return;
      if (ev.kind === 'pollOpen') { groups.pollOpen = { kind: 'pollOpen' }; return; }
      const key = ev.kind + ':' + ev.kitchen;
      (groups[key] = groups[key] || { kind: ev.kind, kitchen: ev.kitchen, labels: [] }).labels.push(ev.label);
    });
    return Object.values(groups).map(g => {
      if (g.kind === 'pollOpen') return 'poll opens';
      const n = g.labels.length;
      const unique = Array.from(new Set(g.labels));
      const who = unique.length === 1 ? unique[0] + (n > 1 ? ' ×' + n : '') : n + ' requests (' + unique.join(', ') + ')';
      const verb = STEP_VERBS[g.kind][n > 1 ? 1 : 0] + (g.kind === 'pickup' ? '' : ' ' + g.kitchen);
      return who + ' ' + verb;
    }).join(' · ');
  }

  const stepEvents = [];
  k1Schedule.forEach(ev => {
    stepEvents.push({ time: ev.arrival,    kind: 'arrive', kitchen: 'one', label: ev.label });
    stepEvents.push({ time: ev.serviceEnd, kind: 'done',   kitchen: 'one', label: ev.label });
  });
  k2Schedule.forEach(ev => {
    stepEvents.push({ time: ev.arrival,    kind: 'arrive', kitchen: 'two', label: ev.label });
    if (ev.serviceStart > ev.arrival) stepEvents.push({ time: ev.serviceStart, kind: 'start', kitchen: 'two', label: ev.label });
    stepEvents.push({ time: ev.serviceEnd, kind: 'done',   kitchen: 'two', label: ev.label });
  });
  captionEvents.forEach(c => stepEvents.push({ time: c.time, kind: 'caption' }));
  const steps = clusterSteps(stepEvents);

  // ---- 3. Rendering ------------------------------------------------------
  const k1Layer = document.getElementById('k1Layer');
  const k2Layer = document.getElementById('k2Layer');
  const k1Counter = document.getElementById('k1Counter');
  const k2Counter = document.getElementById('k2Counter');
  const captionMain = document.getElementById('captionMain');
  const captionSub = document.getElementById('captionSub');
  const chefEls = Array.from(document.querySelectorAll('.chef'));

  const k1Els = {};   // id -> circle element, alive while token is on screen
  const k2Els = {};   // id -> square element, alive only while queued

  function renderK1(t) {
    let active = 0;
    k1Schedule.forEach(ev => {
      const domEnd = ev.serviceEnd + LIT_DURATION + FADE_DURATION;
      let el = k1Els[ev.id];

      if (t < ev.arrival || t >= domEnd) {
        if (el) { k1Layer.removeChild(el); delete k1Els[ev.id]; }
        return;
      }

      if (!el) {
        el = svgEl('circle');
        el.setAttribute('r', 10);
        el.setAttribute('cx', K1_SLOTS[ev.slot][0]);
        el.setAttribute('cy', K1_SLOTS[ev.slot][1]);
        el.setAttribute('class', 'k1-token');
        k1Layer.appendChild(el);
        k1Els[ev.id] = el;
      }

      if (t < ev.serviceEnd) {
        el.setAttribute('class', 'k1-token');
        active++;
      } else if (t < ev.serviceEnd + LIT_DURATION) {
        el.setAttribute('class', 'k1-token lit');
      } else {
        el.setAttribute('class', 'k1-token lit fading');
      }
    });
    k1Counter.textContent = 'active: ' + active;
  }

  function renderK2(t) {
    // Who is currently waiting, in arrival order (this gives each one its queue rank).
    const waiting = k2Schedule
      .filter(ev => t >= ev.arrival && t < ev.serviceStart)
      .sort((a, b) => a.arrival - b.arrival);

    k2Schedule.forEach(ev => {
      const domEnd = ev.serviceEnd + FADE_DURATION;
      let el = k2Els[ev.id];

      const stillQueued = t >= ev.arrival && t < ev.serviceStart;
      const finished = t >= domEnd;

      if (!stillQueued || finished) {
        if (el) { k2Layer.removeChild(el); delete k2Els[ev.id]; }
      }
      if (stillQueued) {
        const rank = waiting.indexOf(ev);
        const row = Math.floor(rank / 9);
        const col = rank % 9;
        const x = 515 + col * 32;
        const y = 330 + row * 35;
        if (!el) {
          el = svgEl('rect');
          el.setAttribute('width', 14);
          el.setAttribute('height', 14);
          el.setAttribute('rx', 3);
          el.setAttribute('class', 'k2-token');
          k2Layer.appendChild(el);
          k2Els[ev.id] = el;
        }
        el.setAttribute('x', x - 7);
        el.setAttribute('y', y - 7);
      }
    });

    const chefBusy = [false, false, false, false];
    k2Schedule.forEach(ev => {
      if (t >= ev.serviceStart && t < ev.serviceEnd) chefBusy[ev.chef] = true;
    });
    chefEls.forEach(el => {
      const idx = parseInt(el.dataset.chef, 10);
      el.classList.toggle('busy', chefBusy[idx]);
    });

    const busyCount = chefBusy.filter(Boolean).length;
    k2Counter.textContent = 'chefs busy: ' + busyCount + '/4 · queue: ' + waiting.length;
  }

  let lastCaptionIndex = -1;
  let stepInfo = null;     // set by Step, cleared by Play and Restart
  let lastSubText = null;
  function renderCaption(t) {
    let idx = 0;
    for (let i = 0; i < captionEvents.length; i++) {
      if (captionEvents[i].time <= t) idx = i;
    }
    if (idx !== lastCaptionIndex) {
      captionMain.textContent = captionEvents[idx].main;
      lastCaptionIndex = idx;
    }
    // While stepping, the sub-caption says what just happened.
    const subText = stepInfo || captionEvents[idx].sub;
    if (subText !== lastSubText) { captionSub.textContent = subText; lastSubText = subText; }
  }

  // ---- 4. Playback loop ---------------------------------------------------
  let accumulated = 0;
  let speed = 1;
  let paused = false;
  let lastTimestamp = null;

  function frame(timestamp) {
    if (lastTimestamp === null) lastTimestamp = timestamp;
    const dt = timestamp - lastTimestamp;
    lastTimestamp = timestamp;

    if (!paused) {
      accumulated = (accumulated + dt * speed) % CYCLE;
      if (accumulated < dt * speed) lastCaptionIndex = -1; // wrapped — force caption refresh
    }

    const t = Math.min(accumulated, TOTAL_DURATION);
    renderK1(t);
    renderK2(t);
    renderCaption(t);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- 5. Controls ---------------------------------------------------------
  const playPauseBtn = document.getElementById('playPauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const stepBtn = document.getElementById('stepBtn');
  const speedBtns = document.querySelectorAll('.speed-btn');

  playPauseBtn.addEventListener('click', () => {
    paused = !paused;
    playPauseBtn.textContent = paused ? 'Play' : 'Pause';
    if (!paused) { lastTimestamp = null; stepInfo = null; }
  });

  restartBtn.addEventListener('click', () => {
    accumulated = 0;
    lastCaptionIndex = -1;
    stepInfo = null;
    paused = false;
    playPauseBtn.textContent = 'Pause';
    lastTimestamp = null;
  });

  stepBtn.addEventListener('click', () => {
    // Jump to the next moment something changes, and pause there.
    const now = Math.min(accumulated, TOTAL_DURATION);
    const next = steps.find(c => c.start > now) || steps[0];
    accumulated = Math.min(next.end + 1, TOTAL_DURATION);
    paused = true;
    playPauseBtn.textContent = 'Play';
    lastCaptionIndex = -1;
    stepInfo = describeStep(next) || null;
  });

  speedBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      speed = parseFloat(btn.dataset.speed);
      speedBtns.forEach(b => b.classList.remove('speed-active'));
      btn.classList.add('speed-active');
    });
  });
})();
</script>


<!-- Reports the document height to the parent page so the embedding iframe can
     size itself to the content at any viewport width. See EmbedFrame.astro. -->
<script>
(function () {
  if (window.parent === window) return;
  function report() {
    window.parent.postMessage(
      { type: 'embed-height', height: document.body.offsetHeight },
      '*'
    );
  }
  new ResizeObserver(report).observe(document.body);
  window.addEventListener('load', report);
  report();
})();
</script>
</body>
</html>
