<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hero diagram: a free-text prompt enters a decision model, which returns a fixed set of scored choices — local 8 percent, general 39 percent, reasoning 53 percent, zero output tokens. Your code rules then make the final pick: the reasoning model. The model reads; the code decides." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The model reads. The code decides.</title>
  <rect width="1200" height="630" fill="#ffffff"/>

  <text x="600" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#12242B">The model reads. The code decides.</text>
  <text x="600" y="96" text-anchor="middle" font-size="15" fill="#64748b">a decision model turns language into a fixed set of scored choices — then hands the numbers to you</text>

  <!-- your prompt -->
  <g>
    <rect x="40" y="150" width="210" height="280" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="145" y="182" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b">YOUR PROMPT</text>
    <text x="145" y="232" text-anchor="middle" font-size="12.5" font-style="italic" fill="#12242B">"Users sometimes see</text>
    <text x="145" y="254" text-anchor="middle" font-size="12.5" font-style="italic" fill="#12242B">stale prices after</text>
    <text x="145" y="276" text-anchor="middle" font-size="12.5" font-style="italic" fill="#12242B">an update, but only</text>
    <text x="145" y="298" text-anchor="middle" font-size="12.5" font-style="italic" fill="#12242B">in production"</text>
    <text x="145" y="400" text-anchor="middle" font-size="11" fill="#94a3b8">free text, no shape</text>
  </g>
  <line x1="258" y1="290" x2="286" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="286,284 300,290 286,296" fill="#94a3b8"/>

  <!-- decision model -->
  <g>
    <rect x="300" y="150" width="360" height="280" rx="10" fill="#f0fbfa" stroke="#0E7C7B" stroke-width="2"/>
    <text x="480" y="182" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#0E7C7B">DECISION MODEL</text>
    <text x="480" y="206" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0B5F5E">scores every option, writes nothing</text>
    <text x="330" y="249" font-size="12" fill="#12242B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">local</text>
    <rect x="430" y="238" width="14" height="14" rx="2" fill="#94a3b8"/>
    <text x="645" y="249" text-anchor="end" font-size="11.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.08</text>
    <text x="330" y="280" font-size="12" fill="#12242B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">general</text>
    <rect x="430" y="269" width="66" height="14" rx="2" fill="#94a3b8"/>
    <text x="645" y="280" text-anchor="end" font-size="11.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.39</text>
    <text x="330" y="311" font-size="12" font-weight="700" fill="#0E7C7B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reasoning</text>
    <rect x="430" y="300" width="90" height="14" rx="2" fill="#0E7C7B"/>
    <text x="645" y="311" text-anchor="end" font-size="11.5" font-weight="700" fill="#0E7C7B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.53</text>
    <rect x="390" y="356" width="180" height="28" rx="6" fill="#ffffff" stroke="#0E7C7B" stroke-width="1"/>
    <text x="480" y="375" text-anchor="middle" font-size="12" fill="#0E7C7B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">output_tokens: 0</text>
  </g>
  <line x1="668" y1="290" x2="696" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="696,284 710,290 696,296" fill="#94a3b8"/>

  <!-- your code -->
  <g>
    <rect x="710" y="150" width="250" height="280" rx="10" fill="#fdf4f8" stroke="#A32E63" stroke-width="2"/>
    <text x="835" y="182" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#A32E63">YOUR CODE</text>
    <text x="835" y="206" text-anchor="middle" font-size="11.5" font-style="italic" fill="#7d234c">the rules make the call</text>
    <text x="730" y="243" font-size="11.5" fill="#12242B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">system → reasoning</text>
    <text x="730" y="271" font-size="11.5" fill="#12242B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">low conf. → bump up</text>
    <text x="730" y="299" font-size="11.5" fill="#12242B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">never move down</text>
    <line x1="730" y1="322" x2="940" y2="322" stroke="#A32E63" stroke-width="0.8" opacity="0.4"/>
    <text x="835" y="400" text-anchor="middle" font-size="11" fill="#A32E63">deterministic</text>
  </g>
  <line x1="968" y1="290" x2="996" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="996,284 1010,290 996,296" fill="#94a3b8"/>

  <!-- final -->
  <g>
    <rect x="1010" y="150" width="150" height="280" rx="10" fill="#fff8ef" stroke="#B45309" stroke-width="2"/>
    <text x="1085" y="182" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B45309">FINAL</text>
    <text x="1085" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#12242B">reasoning</text>
    <text x="1085" y="294" text-anchor="middle" font-size="13" fill="#12242B">model</text>
    <text x="1085" y="400" text-anchor="middle" font-size="10.5" fill="#B45309">a hard task</text>
    <text x="1085" y="416" text-anchor="middle" font-size="10.5" fill="#B45309">never sinks</text>
  </g>

  <text x="600" y="500" text-anchor="middle" font-size="13.5" fill="#64748b">An if-statement cannot tell a commit message from an architecture question. An LLM can — but answers in free text.</text>
  <text x="600" y="532" text-anchor="middle" font-size="13.5" fill="#12242B">A decision model reads the language and answers with a number for every option. Numbers fit in if-statements.</text>
  <text x="600" y="588" text-anchor="middle" font-size="11" letter-spacing="0.06em" fill="#94a3b8">FLEXIBILITY OF AI · CONTROL OF CODE</text>
</svg>
