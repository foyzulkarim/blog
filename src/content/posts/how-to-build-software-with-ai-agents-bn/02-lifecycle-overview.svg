          <text class="lbl sm" x="315" y="158" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">03 Foundation</text>
          <text class="lbl sm" x="425" y="158" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">04 Features</text>
