        <rect class="barstroke" x="40" y="84" width="800" height="44" fill="none" stroke="#c3c3b4" stroke-width="1.5"/>
        <line class="divide" x1="600" y1="78" x2="600" y2="134" stroke="#2e4a62" stroke-width="1.4" stroke-dasharray="3 4"/>
