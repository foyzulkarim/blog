          <line class="tick" x1="315" y1="128" x2="315" y2="140" stroke="#7d93a8" stroke-width="1"/>
          <line class="tick" x1="425" y1="128" x2="425" y2="140" stroke="#7d93a8" stroke-width="1"/>
          <line class="tick" x1="530" y1="128" x2="530" y2="140" stroke="#7d93a8" stroke-width="1"/>
          <line class="tick" x1="680" y1="128" x2="680" y2="140" stroke="#7d93a8" stroke-width="1"/>
          <line class="tick" x1="790" y1="128" x2="790" y2="140" stroke="#7d93a8" stroke-width="1"/>
