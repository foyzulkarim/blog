<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 290" width="936" height="290">
  <rect x="0" y="0" width="936" height="290" rx="12" fill="#fcfcf8" stroke="#dcdcd0" stroke-width="1"/>
  <g transform="translate(28,28)">
        <defs>
          <marker id="ah-f" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" class="ah" fill="#7d93a8" stroke="none"/></marker>
        </defs>
        <!-- zone labels -->
        <text class="eye" x="320" y="52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#2e4a62" letter-spacing="1.3" text-anchor="middle">Think &amp; define — no code yet</text>
        <text class="eye b" x="720" y="52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#0f766e" letter-spacing="1.3" text-anchor="middle">Build &amp; learn</text>
