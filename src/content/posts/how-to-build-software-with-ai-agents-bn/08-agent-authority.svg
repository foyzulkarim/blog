<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 324" width="936" height="324">
  <rect x="0" y="0" width="936" height="324" rx="12" fill="#fcfcf8" stroke="#dcdcd0" stroke-width="1"/>
  <g transform="translate(28,28)">
          <text class="eye b" x="150" y="30" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#0f766e" letter-spacing="1.3" text-anchor="middle">Allowed</text>
          <text class="eye" x="440" y="30" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#a86f16" letter-spacing="1.3" text-anchor="middle">Needs your approval</text>
          <text class="eye" x="730" y="30" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#2e4a62" letter-spacing="1.3" text-anchor="middle">Never</text>
          <g>
            <rect class="node flow" x="14"  y="46" width="272" height="186" rx="10" fill="#d7ebe6" stroke="#0f766e" stroke-width="1.5"/>
            <text class="lbl sm" x="150" y="80" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">read the repo</text>
            <text class="lbl sm" x="150" y="108" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">edit files in its worktree</text>
            <text class="lbl sm" x="150" y="136" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">run the test suite</text>
            <text class="lbl sm" x="150" y="164" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">open a pull request</text>
            <text class="lbl sm" x="150" y="192" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">write to a scratch database</text>
            <text class="lbl sm" x="150" y="220" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#0f766e" font-weight="400" text-anchor="middle">cheap to undo</text>
          </g>
          <g>
            <rect class="node" x="304" y="46" width="272" height="186" rx="10" fill="#ffffff" stroke="#a86f16" stroke-width="1.5"/>
            <text class="lbl sm" x="440" y="80" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">install a dependency</text>
            <text class="lbl sm" x="440" y="108" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">run a migration</text>
            <text class="lbl sm" x="440" y="136" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">call an external service</text>
            <text class="lbl sm" x="440" y="164" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">delete anything</text>
            <text class="lbl sm" x="440" y="192" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">spend money</text>
            <text class="lbl sm" x="440" y="220" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#a86f16" font-weight="400" text-anchor="middle">reversible, but not for free</text>
          </g>
          <g>
            <rect class="node found" x="594" y="46" width="272" height="186" rx="10" fill="#e7edf2" stroke="#2e4a62" stroke-width="1.5"/>
            <text class="lbl sm" x="730" y="80" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">production credentials</text>
            <text class="lbl sm" x="730" y="108" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">the production database</text>
            <text class="lbl sm" x="730" y="136" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">merge to main</text>
            <text class="lbl sm" x="730" y="164" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">deploy</text>
            <text class="lbl sm" x="730" y="192" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">your personal machine</text>
            <text class="lbl sm" x="730" y="220" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#2e4a62" font-weight="400" text-anchor="middle">you own the consequences</text>
          </g>
          <text class="eye" x="440" y="260" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#2e4a62" letter-spacing="1.3" text-anchor="middle">Least privilege. Decide the boundary before you need it, not after</text>
        </g>
</svg>
