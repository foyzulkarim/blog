<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 324" width="936" height="324">
  <rect x="0" y="0" width="936" height="324" rx="12" fill="#fcfcf8" stroke="#dcdcd0" stroke-width="1"/>
  <g transform="translate(28,28)">
          <defs>
            <marker id="ah-d" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" class="ah" fill="#7d93a8" stroke="none"/></marker>
          </defs>
          <!-- main repo -->
          <rect class="node found" x="24" y="102" width="156" height="60" rx="8" fill="#e7edf2" stroke="#2e4a62" stroke-width="1.5"/>
          <text class="lbl" x="102" y="128" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#2e4a62" font-weight="500" text-anchor="middle">main repo</text>
          <text class="lbl sm" x="102" y="145" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">one clone</text>
          <!-- worktrees -->
          <g>
            <rect class="node" x="360" y="26"  width="230" height="56" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="475" y="50" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">worktree · A</text><text class="lbl sm" x="475" y="68" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">feature 1 · agent</text>
            <rect class="node" x="360" y="104" width="230" height="56" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="475" y="128" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">worktree · B</text><text class="lbl sm" x="475" y="146" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">feature 2 · agent</text>
            <rect class="node" x="360" y="182" width="230" height="56" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="475" y="206" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">worktree · C</text><text class="lbl sm" x="475" y="224" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">feature 3 · agent</text>
          </g>
          <!-- merge -->
          <rect class="node flow" x="700" y="102" width="156" height="60" rx="8" fill="#d7ebe6" stroke="#0f766e" stroke-width="1.5"/>
          <text class="lbl tl" x="778" y="128" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#0f766e" font-weight="500" text-anchor="middle">merge</text>
          <text class="lbl sm" x="778" y="145" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400" text-anchor="middle">back to main</text>
          <!-- diverge arrows -->
          <path class="flowline" d="M180,124 C270,108 280,58 358,54"  marker-end="url(#ah-d)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <line class="flowline" x1="180" y1="132" x2="358" y2="132" marker-end="url(#ah-d)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <path class="flowline" d="M180,140 C270,156 280,206 358,210" marker-end="url(#ah-d)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <!-- converge arrows -->
          <path class="flowline" d="M590,54  C680,58 690,108 698,124"  marker-end="url(#ah-d)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <line class="flowline" x1="590" y1="132" x2="698" y2="132" marker-end="url(#ah-d)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <path class="flowline" d="M590,210 C680,206 690,156 698,140" marker-end="url(#ah-d)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <text class="eye" x="440" y="262" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#2e4a62" letter-spacing="1.3" text-anchor="middle">Same Git · separate directories · no interference · run in parallel</text>
        </g>
</svg>
