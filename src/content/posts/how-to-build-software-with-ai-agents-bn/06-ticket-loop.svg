<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 356" width="936" height="356">
  <rect x="0" y="0" width="936" height="356" rx="12" fill="#fcfcf8" stroke="#dcdcd0" stroke-width="1"/>
  <g transform="translate(28,28)">
          <defs>
            <marker id="ah-c" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" class="ah" fill="#7d93a8" stroke="none"/></marker>
          </defs>
          <!-- entry -->
          <text class="lbl sm" x="16" y="40" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#0f766e" font-weight="400">pick a ticket ↓</text>
          <!-- top row -->
          <g>
            <rect class="node" x="16"  y="48" width="160" height="54" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="96"  y="80" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">Requirement</text>
            <rect class="node" x="232" y="48" width="160" height="54" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="312" y="80" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">Implement</text>
            <rect class="node" x="448" y="48" width="160" height="54" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="528" y="80" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">Commit</text>
            <rect class="node" x="664" y="48" width="160" height="54" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="744" y="80" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">Pull request</text>
          </g>
          <!-- top arrows -->
          <line class="flowline" x1="176" y1="75" x2="230" y2="75" marker-end="url(#ah-c)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <line class="flowline" x1="392" y1="75" x2="446" y2="75" marker-end="url(#ah-c)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <line class="flowline" x1="608" y1="75" x2="662" y2="75" marker-end="url(#ah-c)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <!-- down from PR to Review -->
          <line class="flowline" x1="744" y1="102" x2="744" y2="196" marker-end="url(#ah-c)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <!-- bottom row -->
          <g>
            <rect class="node"      x="664" y="198" width="160" height="54" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="744" y="230" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">Review</text>
            <rect class="node"      x="448" y="198" width="160" height="54" rx="8" fill="#ffffff" stroke="#2e4a62" stroke-width="1.5"/><text class="lbl" x="528" y="230" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#191c22" font-weight="500" text-anchor="middle">Fix</text>
            <rect class="node flow" x="232" y="198" width="160" height="54" rx="8" fill="#d7ebe6" stroke="#0f766e" stroke-width="1.5"/><text class="lbl tl" x="312" y="230" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#0f766e" font-weight="500" text-anchor="middle">Merge</text>
          </g>
          <!-- bottom arrows (right to left) -->
          <line class="flowline" x1="662" y1="225" x2="610" y2="225" marker-end="url(#ah-c)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <line class="flowline" x1="446" y1="225" x2="394" y2="225" marker-end="url(#ah-c)" fill="none" stroke="#7d93a8" stroke-width="1.6"/>
          <!-- return curve merge -> requirement -->
          <path class="flowline dash" d="M232,238 C90,268 24,190 96,104" marker-end="url(#ah-c)" fill="none" stroke="#7d93a8" stroke-width="1.6" stroke-dasharray="4 5"/>
          <text class="lbl sm" x="70" y="168" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#565d67" font-weight="400">next ticket</text>
        </g>
</svg>
