<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The plan-execute split: plan-qa interviews the human, execute-qa runs the artifact mechanically" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The split is the design</title>
  <rect width="1200" height="630" fill="#ffffff"/>

  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a" letter-spacing="-0.5">The split is the design</text>

  <g>
    <rect x="40" y="80" width="540" height="500" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="310" y="120" text-anchor="middle" font-size="26" font-weight="700" fill="#78350f">Plan-qa</text>
    <text x="310" y="146" text-anchor="middle" font-size="15" fill="#92400e" font-style="italic">judgment, conversation</text>
    <line x1="80" y1="178" x2="540" y2="178" stroke="#d97706" stroke-width="1" opacity="0.35"/>

    <g transform="translate(85, 230)">
      <circle cx="28" cy="28" r="24" fill="#fbbf24" stroke="#78350f" stroke-width="2"/>
      <circle cx="28" cy="20" r="7" fill="#78350f"/>
      <path d="M 10 44 Q 10 32 28 32 Q 46 32 46 44" fill="#78350f"/>
      <text x="70" y="22" font-size="17" font-weight="600" fill="#78350f">human in the loop</text>
      <text x="70" y="44" font-size="15" fill="#92400e">decides what to test, supplies the traps</text>
    </g>

    <g transform="translate(85, 350)">
      <rect x="4" y="18" width="50" height="40" rx="6" fill="#fbbf24" stroke="#78350f" stroke-width="2"/>
      <circle cx="20" cy="34" r="4" fill="#78350f"/>
      <circle cx="38" cy="34" r="4" fill="#78350f"/>
      <rect x="24" y="48" width="10" height="2.5" fill="#78350f"/>
      <text x="70" y="36" font-size="17" font-weight="600" fill="#78350f">agent captures, proposes, structures</text>
    </g>
  </g>

  <g>
    <rect x="620" y="80" width="540" height="500" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="890" y="120" text-anchor="middle" font-size="26" font-weight="700" fill="#3730a3">Execute-qa</text>
    <text x="890" y="146" text-anchor="middle" font-size="15" fill="#4338ca" font-style="italic">mechanical, scripted</text>
    <line x1="660" y1="178" x2="1120" y2="178" stroke="#4f46e5" stroke-width="1" opacity="0.35"/>

    <g transform="translate(685, 250)">
      <rect x="0" y="0" width="80" height="68" rx="8" fill="#a5b4fc" stroke="#3730a3" stroke-width="2"/>
      <circle cx="24" cy="28" r="5.5" fill="#3730a3"/>
      <circle cx="56" cy="28" r="5.5" fill="#3730a3"/>
      <rect x="28" y="48" width="24" height="4" fill="#3730a3"/>
    </g>

    <text x="790" y="278" font-size="17" font-weight="600" fill="#3730a3">agent runs every case,</text>
    <text x="790" y="302" font-size="17" font-weight="600" fill="#3730a3">asserts, hands off to operator</text>
    <text x="790" y="326" font-size="17" fill="#4338ca">when a step needs a human</text>
  </g>
</svg>
