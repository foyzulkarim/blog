<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The plan-execute split: plan-qa interviews the human, execute-qa runs the artifact mechanically" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The split is the design</title>
  <rect width="1200" height="1200" fill="#ffffff"/>

  <text x="600" y="130" text-anchor="middle" font-size="56" font-weight="700" fill="#0f172a" letter-spacing="-1">The split is the design</text>

  <g>
    <rect x="80" y="210" width="1040" height="430" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>

    <text x="600" y="280" text-anchor="middle" font-size="44" font-weight="700" fill="#78350f">Plan-qa</text>
    <text x="600" y="320" text-anchor="middle" font-size="22" fill="#92400e" font-style="italic">judgment, conversation</text>

    <line x1="200" y1="360" x2="1000" y2="360" stroke="#d97706" stroke-width="1.5" opacity="0.35"/>

    <g transform="translate(220, 400)">
      <circle cx="50" cy="50" r="38" fill="#fbbf24" stroke="#78350f" stroke-width="2.5"/>
      <circle cx="50" cy="35" r="12" fill="#78350f"/>
      <path d="M 20 78 Q 20 56 50 56 Q 80 56 80 78" fill="#78350f"/>
      <text x="120" y="42" font-size="26" font-weight="600" fill="#78350f">human in the loop</text>
      <text x="120" y="74" font-size="22" fill="#92400e">decides what to test, supplies the traps</text>
    </g>

    <g transform="translate(220, 520)">
      <rect x="6" y="30" width="88" height="70" rx="10" fill="#fbbf24" stroke="#78350f" stroke-width="2.5"/>
      <circle cx="32" cy="56" r="6" fill="#78350f"/>
      <circle cx="68" cy="56" r="6" fill="#78350f"/>
      <rect x="38" y="78" width="24" height="4" fill="#78350f"/>
      <text x="120" y="56" font-size="26" font-weight="600" fill="#78350f">agent captures, proposes, structures</text>
    </g>
  </g>

  <g>
    <rect x="80" y="680" width="1040" height="430" rx="20" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>

    <text x="600" y="750" text-anchor="middle" font-size="44" font-weight="700" fill="#3730a3">Execute-qa</text>
    <text x="600" y="790" text-anchor="middle" font-size="22" fill="#4338ca" font-style="italic">mechanical, scripted</text>

    <line x1="200" y1="830" x2="1000" y2="830" stroke="#4f46e5" stroke-width="1.5" opacity="0.35"/>

    <g transform="translate(360, 890)">
      <rect x="0" y="0" width="140" height="120" rx="14" fill="#a5b4fc" stroke="#3730a3" stroke-width="3"/>
      <circle cx="42" cy="48" r="10" fill="#3730a3"/>
      <circle cx="98" cy="48" r="10" fill="#3730a3"/>
      <rect x="48" y="82" width="44" height="7" fill="#3730a3"/>
    </g>

    <text x="540" y="930" font-size="26" font-weight="600" fill="#3730a3">agent runs every case,</text>
    <text x="540" y="965" font-size="26" font-weight="600" fill="#3730a3">asserts, hands off to operator</text>
    <text x="540" y="1000" font-size="26" fill="#4338ca">when a step needs a human</text>
  </g>
</svg>
