<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The plan-execute split: plan-qa interviews the human, execute-qa runs the artifact mechanically" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The split is the design</title>
  <rect width="900" height="300" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">The split is the design</text>

  <g>
    <rect x="40" y="70" width="320" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="200" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">Plan-qa</text>
    <text x="200" y="120" text-anchor="middle" font-size="11" fill="#92400e" font-style="italic">judgment, conversation</text>

    <g transform="translate(70, 150)">
      <circle cx="20" cy="20" r="16" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="20" cy="14" r="5" fill="#78350f"/>
      <path d="M 8 30 Q 8 22 20 22 Q 32 22 32 30" fill="#78350f"/>
      <text x="50" y="18" font-size="11" font-weight="500" fill="#78350f">human in the loop</text>
      <text x="50" y="32" font-size="10" fill="#92400e">decides what to test,</text>
      <text x="50" y="46" font-size="10" fill="#92400e">supplies the traps</text>
    </g>

    <g transform="translate(70, 220)">
      <rect x="0" y="0" width="40" height="32" rx="4" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3" fill="#78350f"/>
      <circle cx="28" cy="12" r="3" fill="#78350f"/>
      <rect x="14" y="22" width="12" height="2" fill="#78350f"/>
      <text x="50" y="14" font-size="11" font-weight="500" fill="#78350f">agent captures,</text>
      <text x="50" y="28" font-size="10" fill="#92400e">proposes, structures</text>
    </g>
  </g>

  <g transform="translate(380, 160)">
    <text x="70" y="-8" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">the artifact</text>
    <text x="70" y="8" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">specs/qa/QA-N-slug.md</text>
    <text x="70" y="22" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">machine-executable</text>
    <line x1="0" y1="35" x2="120" y2="35" stroke="#475569" stroke-width="2"/>
    <polygon points="120,30 132,35 120,40" fill="#475569"/>
  </g>

  <g>
    <rect x="540" y="70" width="320" height="200" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="700" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3">Execute-qa</text>
    <text x="700" y="120" text-anchor="middle" font-size="11" fill="#4338ca" font-style="italic">mechanical, scripted</text>

    <g transform="translate(680, 150)">
      <rect x="0" y="0" width="60" height="50" rx="6" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/>
      <circle cx="18" cy="20" r="4" fill="#3730a3"/>
      <circle cx="42" cy="20" r="4" fill="#3730a3"/>
      <rect x="20" y="34" width="20" height="3" fill="#3730a3"/>
    </g>
    <text x="700" y="225" text-anchor="middle" font-size="11" font-weight="500" fill="#3730a3">agent runs every case,</text>
    <text x="700" y="242" text-anchor="middle" font-size="11" fill="#4338ca">asserts, hands off to operator</text>
    <text x="700" y="258" text-anchor="middle" font-size="11" fill="#4338ca">when a step needs a human</text>
  </g>
</svg>
