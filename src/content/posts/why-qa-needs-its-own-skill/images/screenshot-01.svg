<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Screenshot 01, Familiarization: the agent has read the pull request before the first question lands" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Screenshot 01 — Familiarization</title>
  <rect width="800" height="320" fill="#fafafa"/>

  <text x="400" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Familiarization</text>
  <text x="400" y="62" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">the agent has read the PR before the first question lands</text>

  <g>
    <rect x="80" y="100" width="180" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="170" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">the pull request</text>
    <text x="170" y="150" text-anchor="middle" font-size="11" fill="#64748b">diff, commits, files</text>
    <text x="170" y="170" text-anchor="middle" font-size="11" fill="#64748b">specs, arch, tasks</text>
    <text x="170" y="200" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">the input</text>
  </g>

  <g>
    <text x="335" y="148" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">reads</text>
    <line x1="265" y1="160" x2="395" y2="160" stroke="#475569" stroke-width="2"/>
    <polygon points="395,156 405,160 395,164" fill="#475569"/>
  </g>

  <g>
    <rect x="410" y="100" width="200" height="120" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="510" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">the agent</text>
    <text x="510" y="150" text-anchor="middle" font-size="11" fill="#4338ca">PR internalized</text>
    <text x="510" y="170" text-anchor="middle" font-size="11" fill="#4338ca">summary produced</text>
    <text x="510" y="200" text-anchor="middle" font-size="10" fill="#6366f1" font-style="italic">ready for the conversation</text>
  </g>

  <g>
    <line x1="630" y1="160" x2="720" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <polygon points="720,156 730,160 720,164" fill="#94a3b8"/>
    <text x="680" y="148" text-anchor="middle" font-size="10" fill="#64748b">first</text>
    <text x="680" y="184" text-anchor="middle" font-size="10" fill="#64748b">question</text>
  </g>
</svg>
