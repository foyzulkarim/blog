<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hero diagram: the gap between tests passing and the thing working, bridged by a QA skill" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The tests pass. The thing works. Not the same sentence.</title>
  <rect width="800" height="240" fill="#ffffff"/>

  <text x="400" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">The tests pass. The thing works. Not the same sentence.</text>

  <g>
    <rect x="40" y="70" width="240" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="160" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">AUTOMATED TESTS</text>
    <text x="160" y="125" text-anchor="middle" font-size="12" fill="#166534">asserted in code</text>
    <text x="160" y="155" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">"the tests pass"</text>
    <text x="160" y="175" text-anchor="middle" font-size="10" fill="#15803d">fast, mechanical, in CI</text>
  </g>

  <g>
    <text x="400" y="105" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">the gap</text>
    <line x1="290" y1="135" x2="510" y2="135" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <polygon points="510,130 522,135 510,140" fill="#94a3b8"/>
    <text x="400" y="160" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">judgment, scenarios, traps</text>
  </g>

  <g>
    <rect x="520" y="70" width="240" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="640" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">QA SKILL</text>
    <text x="640" y="125" text-anchor="middle" font-size="12" fill="#1e3a8a">human + agent, structured</text>
    <text x="640" y="155" text-anchor="middle" font-size="11" fill="#1e3a8a" font-style="italic">"the thing works"</text>
    <text x="640" y="175" text-anchor="middle" font-size="10" fill="#1e40af">slow, judged, before release</text>
  </g>

  <text x="400" y="220" text-anchor="middle" font-size="12" fill="#475569">a skill is a contract about where judgment lives</text>
</svg>
