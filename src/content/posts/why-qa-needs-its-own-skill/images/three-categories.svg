<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three categories of things tests cannot reach: what a human sees, whole-request behavior, deploy-time risk" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>What tests cannot reach</title>
  <rect width="900" height="320" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">What tests cannot reach</text>

  <g>
    <rect x="40" y="60" width="260" height="240" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="170" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#7e22ce">What a human sees</text>
    <text x="170" y="113" text-anchor="middle" font-size="11" fill="#6b21a8" font-style="italic">rendered page, real browser</text>

    <text x="60" y="148" font-size="11" fill="#581c87">• button visually exists,</text>
    <text x="72" y="164" font-size="11" fill="#581c87">  not reachable by tap</text>
    <text x="60" y="190" font-size="11" fill="#581c87">• dropdown says "Select"</text>
    <text x="72" y="206" font-size="11" fill="#581c87">  with empty first option</text>
    <text x="60" y="232" font-size="11" fill="#581c87">• toast says "Settings saved"</text>
    <text x="72" y="248" font-size="11" fill="#581c87">  when email was changed</text>

    <text x="170" y="282" text-anchor="middle" font-size="10" fill="#7e22ce" font-weight="500">UI · rendering</text>
  </g>

  <g>
    <rect x="320" y="60" width="260" height="240" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">Whole-request behavior</text>
    <text x="450" y="113" text-anchor="middle" font-size="11" fill="#065f46" font-style="italic">running server, real state</text>

    <text x="340" y="148" font-size="11" fill="#064e3b">• sign in on two browsers,</text>
    <text x="352" y="164" font-size="11" fill="#064e3b">  what happens to the second?</text>
    <text x="340" y="190" font-size="11" fill="#064e3b">• session cookie expires</text>
    <text x="352" y="206" font-size="11" fill="#064e3b">  mid-flow</text>
    <text x="340" y="232" font-size="11" fill="#064e3b">• API returns 401 to a form</text>
    <text x="352" y="248" font-size="11" fill="#064e3b">  that was rendering</text>

    <text x="450" y="282" text-anchor="middle" font-size="10" fill="#047857" font-weight="500">auth · session · real state</text>
  </g>

  <g>
    <rect x="600" y="60" width="260" height="240" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="730" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">Deploy-time risk</text>
    <text x="730" y="113" text-anchor="middle" font-size="11" fill="#7c2d12" font-style="italic">rolling deploys, fresh schemas</text>

    <text x="620" y="148" font-size="11" fill="#7c2d12">• migration drops a column</text>
    <text x="632" y="164" font-size="11" fill="#7c2d12">  the app still reads from</text>
    <text x="620" y="190" font-size="11" fill="#7c2d12">• cache serves stale data</text>
    <text x="632" y="206" font-size="11" fill="#7c2d12">  because not invalidated</text>
    <text x="620" y="232" font-size="11" fill="#7c2d12">• schema constraint fails</text>
    <text x="632" y="248" font-size="11" fill="#7c2d12">  in production (more rows)</text>

    <text x="730" y="282" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="500">schema · cache · environment</text>
  </g>
</svg>
