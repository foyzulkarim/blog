<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>Responsive specimen — foyzul</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="wordmark" href="./index.html">foyzul</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="./index.html">Writing</a>
          <a href="https://foyzul.com/courses">Courses</a>

    <main class="viewport-gallery">
      <h1>Responsive specimen</h1>
      <p class="lede">The benchmark section rendered in exact-width document viewports. Frames remain scrollable when wider than this review page.</p>

      <section class="viewport-demo" aria-labelledby="viewport-1440">
        <h2 id="viewport-1440">1440px</h2>
        <div class="viewport-demo__scroll">
          <iframe src="./post.html#benchmark" width="1440" title="Post specimen at 1440 pixels"></iframe>
        </div>
      </section>

      <section class="viewport-demo" aria-labelledby="viewport-768">
        <h2 id="viewport-768">768px</h2>
        <div class="viewport-demo__scroll">
          <iframe src="./post.html#benchmark" width="768" title="Post specimen at 768 pixels"></iframe>
        </div>
      </section>

      <section class="viewport-demo" aria-labelledby="viewport-380">
        <h2 id="viewport-380">380px</h2>
        <div class="viewport-demo__scroll">
          <iframe src="./post.html#benchmark" width="380" title="Post specimen at 380 pixels"></iframe>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
